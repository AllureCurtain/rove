<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>rove</title>
    <link rel="stylesheet" href="/web/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="chat-pane" aria-label="Chat">
        <header class="topbar">
          <div>
            <h1>rove</h1>
            <p id="run-meta">No active run</p>
          </div>
          <button id="cancel" type="button" disabled>Cancel</button>
        </header>

        <div id="messages" class="messages" aria-live="polite"></div>

        <form id="job-form" class="composer">
          <textarea
            id="message"
            name="message"
            rows="4"
            placeholder="Ask rove to inspect, plan, or change this workspace"
            required
          ></textarea>
          <div class="composer-actions">
            <label>
              Model
              <input id="model" name="model" value="fake" />
            </label>
            <label>
              Max steps
              <input id="max-steps" name="max_steps" type="number" min="1" max="50" value="8" />
            </label>
            <button id="submit" type="submit">Run</button>
          </div>
        </form>
      </section>

      <aside class="inspector" aria-label="Run details">
        <section>
          <h2>Plan</h2>
          <ol id="plan" class="plan"></ol>
        </section>

        <section>
          <h2>Tool Calls</h2>
          <div id="tools" class="tool-list"></div>
        </section>

        <section>
          <h2>Trace</h2>
          <div id="trace" class="trace"></div>
        </section>
      </aside>
    </main>
    <script src="/web/app.js" defer></script>
  </body>
</html>
