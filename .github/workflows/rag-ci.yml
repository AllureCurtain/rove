name: RAG CI

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/main.rs"
      - "src/tools/mod.rs"
      - "src/tools/rag.rs"
      - "src/bin/rove-index.rs"
      - "tests/rag.rs"
      - ".github/workflows/rag-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/main.rs"
      - "src/tools/mod.rs"
      - "src/tools/rag.rs"
      - "src/bin/rove-index.rs"
      - "tests/rag.rs"
      - ".github/workflows/rag-ci.yml"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_BACKTRACE: 1

jobs:
  rag-clippy:
    name: rag feature clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-rag-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-rag-

      - name: cargo clippy --features rag
        run: cargo clippy --all-targets --features rag -- -D warnings

  rag-index:
    name: rag index build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-rag-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-rag-

      - name: cargo check rove-index --features rag
        run: cargo check --features rag --bin rove-index

  rag-test:
    name: rag integration test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-rag-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-rag-

      - name: cargo test rag --features rag
        run: cargo test --features rag --test rag
