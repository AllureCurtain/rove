[package]
name = "rove-api"
version.workspace = true
edition.workspace = true
description = "HTTP/SSE/OpenAPI application surface for Rove"
default-run = "rove-api"

[[bin]]
name = "rove-api"
path = "src/main.rs"

[lib]
name = "rove_api"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
chrono.workspace = true
clap.workspace = true
futures.workspace = true
reqwest.workspace = true
rove-app-bootstrap.workspace = true
rove-bench.workspace = true
rove-core.workspace = true
rove-models.workspace = true
rove-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
utoipa-swagger-ui.workspace = true

[dev-dependencies]
rusqlite.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
