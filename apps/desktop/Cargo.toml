[package]
name = "rove-desktop"
version = "0.1.0"
edition = "2021"
authors = ["Rove Contributors"]
description = "Rove Desktop application powered by Tauri 2"
license = "MIT"

[dependencies]
tauri = { version = "2.1", features = [] }
rove-api = { path = "../api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
base64 = "0.22"
reqwest = "0.13"
open = "5.0"
url = "2"
rfd = "0.15"
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_Security_Credentials"] }

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[lib]
name = "rove_desktop"
crate-type = ["lib", "cdylib", "staticlib"]
