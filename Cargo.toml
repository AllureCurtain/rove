[workspace]
members = [
    "models",
    "core",
    "runtime",
    "apps/bootstrap",
    "apps/bench",
    "apps/api",
    "apps/cli",
    "apps/desktop",
    "tests",
]
default-members = ["apps/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.102"
async-stream = "0.3.6"
async-trait = "0.1.89"
axum = "0.8"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dotenvy = "0.15.7"
eventsource-stream = "0.2.3"
figment = { version = "0.10", features = ["toml", "env"] }
futures = "0.3.32"
insta = "1"
pretty_assertions = "1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "unstable-rendered-line-info"] }
regex = "1"
reqwest = { version = "0.13.3", features = ["json", "stream"] }
rove-core = { path = "core" }
rove-models = { path = "models" }
rove-runtime = { path = "runtime" }
rove-app-bootstrap = { path = "apps/bootstrap" }
rove-bench = { path = "apps/bench" }
rove-api = { path = "apps/api" }
rove-cli = { path = "apps/cli" }
rusqlite = { version = "0.32", features = ["bundled"] }
rustyline = "18.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10"
tempfile = "3"
thiserror = "2.0.18"
tokio = { version = "1.52", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-test = "0.4"
tokio-util = "0.7"
toml = "0.8.23"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
ulid = { version = "1.2.1", features = ["serde"] }
utoipa = { version = "5.5.0", features = ["chrono"] }
utoipa-axum = "0.2.0"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
walkdir = "2"

