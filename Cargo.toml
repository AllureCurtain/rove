[package]
name = "rove"
version = "0.1.0"
edition = "2024"
description = "A local-first, stateful, observable general-purpose agent runtime"
default-run = "rove"

[[bin]]
name = "rove"
path = "src/main.rs"

[[bin]]
name = "rove-index"
path = "src/bin/rove-index.rs"
required-features = ["rag"]

[[bin]]
name = "rove-api"
path = "src/bin/rove-api.rs"

[[bin]]
name = "rove-bench"
path = "src/bin/rove-bench.rs"

[lib]
name = "rove"
path = "src/lib.rs"

[features]
default = []
rag = ["dep:arrow-array", "dep:arrow-schema", "dep:lancedb", "dep:walkdir"]

[dependencies]
# Async runtime
tokio = { version = "1.52", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
async-stream = "0.3.6"
async-trait = "0.1.89"
futures = "0.3.32"

# HTTP + LLM
reqwest = { version = "0.13.3", features = ["json", "stream"] }
eventsource-stream = "0.2.3"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rusqlite = { version = "0.32", features = ["bundled"] }

# CLI
clap = { version = "4.6.1", features = ["derive"] }

# Logging / Tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# Errors
thiserror = "2.0.18"
anyhow = "1.0.102"

# IDs / Time
ulid = { version = "1.2.1", features = ["serde"] }
chrono = { version = "0.4.44", features = ["serde"] }

# Config
dotenvy = "0.15.7"
figment = { version = "0.10", features = ["toml", "env"] }
arrow-array = { version = "58.3.0", optional = true }
arrow-schema = { version = "58.3.0", optional = true }
lancedb = { version = "0.29.0", optional = true }
walkdir = { version = "2.5.0", optional = true }
sha2 = "0.10"
rustyline = "18.0.0"
utoipa = { version = "5.5.0", features = ["chrono"] }
utoipa-axum = "0.2.0"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }

[dev-dependencies]
tokio-test = "0.4"
pretty_assertions = "1"
insta = "1"
tempfile = "3"

[profile.test]
debug = 0
